<!doctype html>
<html lang="fr">
    <head>
        
        <meta charset="utf-8">
        <title>Login page</title>
        <link  rel="stylesheet" href="./CSS/styleIndex.css"/>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

    <body>
        <header class="indexHeader">
            <h1>Messagerie Fil-Rouge</h1>
            <p>Connectez-vous et échangez avec vos contacts.</p>

        </header>

        <main class="indexMain">

            <section class="authPart">
                <h2>Connexion</h2>
                <form id="loginForm">
                <label  for="emailLogin">Adresse e-mail</label>
                <input type="email" id="emailLogin" name="emailLogin" placeholder="exemple@etu.uqac.ca" >
                <label for="passwordLogin"><br> Mot de passe</label>
                <input type="password" id="passwordLogin" name="passwordLogin" placeholder="Votre mot de passe">
                <p id="errorPasswordLogin"></p>
                <button type="submit">Se connecter</button>
                <p></p>
                <a href="x.html">Mot de passe oublié ?</a>
                <p></p>
                </form>
            </section>
            <section class="authPart">
                <h2>Créer un compte</h2>
            <form id="registrationForm">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name" placeholder="name" required>
                    <br>
                    <label  for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
                    <br>
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password"placeholder="Votre mot de passe" required>
                    <br>
                    <label for="pseudo">Pseudo chess.com</label>
                    <input type="text" id="pseudo" name="pseudo" placeholder="username">
                    <br>
                    <label for="posX">Position X :</label>
                    <input type="number" id="posX" name="x" placeholder="0" value="0" >
                    <label for="posY">Position Y :</label>
                    <input type="number" id="posY" name="y" placeholder="0" value="0">
                    <br>
                    <label for="birthDate">Date de naissance</label >
                    <input type="date" id="birthDate" name="birthDate" required>
                    <br>
                    <p id="errorPassword"></p>
                    <button type="submit">S'inscrire</button>
            </form>

            </section>

        </main>

        <script src="./JS/index.js" ></script>
    </body>

    
</html>
