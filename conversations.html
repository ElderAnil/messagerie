<!doctype html>

        <meta charset="utf-8">

        <title>CONVERSATIONS</title>

    <body class="conversationBody">
        <header class="indexHeader"> <!-- Re-using index's header styling -->
            <h1>CONVERSATIONS</h1>
            <p>Retrouvez toute vos conversations ici !</p>
        </header>

        <main class="conversationMain">
            <div class="conversationList">
                <h2>Vos conversations</h2>

                <form class="conversationAdder" id="conversationAdder">
                    <input id="conversationNameInput" type="text" placeholder="Nom du salon" autocomplete="off">
                    <button type="submit">Créer</button>
                </form>

                <ul id="conversations">
                    <!-- Conversations are added to this list -->
                </ul>
            </div>

            <div class="conversationCurrent">
                <h2 id="conversationName">Nom du salon</h2>

                <form class="conversationInput" id="conversationInput">
                    <input id="conversationMessageInput" type="text" placeholder="Écrire un message..." autocomplete="off">
                    <button type="submit">Envoyer</button>
                    <button type="button" id="conversationChessInput">Chess</button>
                </form>
