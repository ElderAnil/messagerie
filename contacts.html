
<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <link  rel="stylesheet" href="./CSS/styleIndex.css"/>
        <title>CONTACTS</title>
        </head>

    <body>
        <h1>Pages des contacts</h1>
        
        <a href="conversations.html">
        <button>Aller dans CONVERSATIONS</button>
        </a>
        <br>

        <label for="myContact">Recherche dans les contacts:</label>
        <input list="contactList" id="myContact" name="myContact" />

       <datalist id="contactList">
        <option value="Jean"></option>
        <option value="Octave"></option>
        <option value="Adil"></option>
        <option value="Anil"></option>
        <option value="Akil"></option>
        </datalist>

        <div class="tableContainer">
        <table>
          <thead>
            <tr>
              <th>Avatar</th>
              <th>Bio</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="contactCell">
                <img src="images/defaultprofile.svg" alt="Avatar de Jean-Marie" class="avatar"/>
                Jean-Marie
              </td>
              <td>J'aime la vie !</td>
            </tr>
            <tr>
              <td class="contactCell">
              <img src="images/defaultprofile.svg" alt="Avatar de Louis" class="avatar"/>
              Louis</td>
              <td>Aucun commentaire</td>
            </tr>
            <tr>
              <td class="contactCell">
                <img src="images/defaultprofile.svg" alt="Avatar de Denis" class="avatar"/>
              Denis</td>
              <td>AFK!</td>
            </tr>
            <tr>
              <td class="contactCell">
              <img src="images/defaultprofile.svg" alt="Avatar de Eric" class="avatar"/>
              Eric</td>
              <td>Aucun commentaire</td>
            </tr>
          </tbody>
          </table>
      </div>

     </body>
</html>
