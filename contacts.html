
<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <link  rel="stylesheet" href="./CSS/styleIndex.css"/>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <title>CONTACTS</title>
        </head>

    <body>
        <h1>Pages des contacts</h1>
        
        <a href="conversations.html">
        <button>Aller dans CONVERSATIONS</button>
        </a>
        <br>
        
        <p>Bonjour <span id="userConnected"></span> !</p>

        
        <h2>Ajouter un ami</h2>
        <label for="searchUser">Email de l'utilisateur : </label>
        <input type="email" id="searchUser">

        <button id="searchUserButton" type="button">
          Rechercher
        </button>

        <button id="sendInvitationButton" type="button">
          Envoyer une invitation
        </button>

        <p id="searchMessage"></p>
        <div id="searchResults"></div>

        <label for="myContact">Recherche dans les contacts : </label>
        <input list="contactList" id="myContact" name="myContact" />

        <div class="tableContainer">
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Adresse</th>
            </tr>
          </thead>
          <tbody id="friendsTableBody">
          </tbody>
          </table>
      </div>

      <h2>Invitations reçues</h2>
      <div id="receivedInvitations"></div>
      <p id="invitationMessage"></p>

      <script src="./JS/contacts.js" ></script>
     </body>
</html>
